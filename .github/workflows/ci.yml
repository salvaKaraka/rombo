name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # jsdom 30 arrastra un undici que necesita `webidl.util.markAsUncloneable`,
        # ausente en Node 20. De ahí el mínimo de 22.
        node: [22, 24]

    name: verificar (node ${{ matrix.node }})

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Tipos
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
