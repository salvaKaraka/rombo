<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="rombo">
  <!-- Rombo: el símbolo de la relación en la notación entidad-relación. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#g)"/>

  <!-- Los conectores que entran al rombo, como en un diagrama real. -->
  <path d="M4 32h9M51 32h9" stroke="#ede9fe" stroke-width="3.5" stroke-linecap="round" opacity=".55"/>

  <!-- El rombo, hueco para que se lea la silueta incluso a 16px. -->
  <path d="M32 12 52 32 32 52 12 32Z" fill="none" stroke="#ede9fe" stroke-width="5.5"
        stroke-linejoin="round"/>

  <!-- Punto central: el círculo lleno del identificador. -->
  <circle cx="32" cy="32" r="4.6" fill="#ede9fe"/>
</svg>
